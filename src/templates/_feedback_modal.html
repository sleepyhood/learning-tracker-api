<!-- 피드백 작성 모달 공통 컴포넌트 -->
<style>
  .feedback-modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10000;
  }
  .feedback-modal-card {
    background: #ffffff;
    border: 1px solid rgba(0, 0, 0, 0.08);
    border-radius: 24px;
    width: 380px;
    max-width: 90%;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    animation: feedback-fadeIn 0.25s ease-out;
    box-sizing: border-box;
  }
  @keyframes feedback-fadeIn {
    from { transform: scale(0.95); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .feedback-modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    padding-bottom: 10px;
  }
  .feedback-modal-title {
    font-size: 1.05rem;
    font-weight: 800;
    color: #222222;
  }
  .feedback-modal-close {
    background: none;
    border: none;
    font-size: 1.6rem;
    cursor: pointer;
    color: #888;
    line-height: 1;
    padding: 0;
  }
  .feedback-modal-close:hover {
    color: #222;
  }
  .feedback-student-info {
    font-size: 0.9rem;
    color: #495057;
    background: #f8f9fa;
    padding: 8px 12px;
    border-radius: 12px;
    margin-bottom: 4px;
  }
  .feedback-modal-section {
    display: flex;
    flex-direction: column;
    gap: 8px;
    border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    padding-bottom: 14px;
  }
  .feedback-modal-section:last-child {
    border-bottom: none;
    padding-bottom: 0;
  }
  .feedback-section-title {
    font-size: 0.85rem;
    font-weight: 800;
    color: #373a3c;
  }
  .feedback-problems-text {
    font-size: 0.82rem;
    color: #495057;
    line-height: 1.4;
    background: #eef2f7;
    padding: 10px;
    border-radius: 12px;
    word-break: break-all;
  }
  .feedback-checkbox-row {
    display: flex;
    gap: 16px;
    align-items: center;
  }
  .feedback-checkbox {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.85rem;
    font-weight: 700;
    color: #495057;
    cursor: pointer;
  }
  .feedback-checkbox input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: #6c5ce7;
  }
  .feedback-step-container {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .feedback-step-label {
    font-size: 0.78rem;
    font-weight: 700;
    color: #868e96;
  }
  .feedback-input {
    border: 1.5px solid #dee2e6;
    border-radius: 12px;
    padding: 8px 12px;
    font-size: 0.82rem;
    font-weight: 500;
    outline: none;
    background: #ffffff;
    width: 100%;
    box-sizing: border-box;
    color: #495057;
    transition: all 0.2s ease;
  }
  .feedback-input:focus {
    border-color: #6c5ce7;
    box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.15);
  }
  .feedback-textarea {
    resize: none;
    min-height: 38px;
    max-height: 120px;
    overflow-y: auto;
    font-family: inherit;
    line-height: 1.4;
  }
  .feedback-btn {
    border: none;
    border-radius: 20px;
    padding: 10px 12px;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    transition: all 0.2s ease;
    width: 100%;
  }
  .feedback-btn:hover {
    transform: translateY(-1px);
  }
  .feedback-btn:active {
    transform: translateY(0);
  }
  .feedback-ai-btn {
    background: #6c5ce7;
    color: white;
    box-shadow: 0 4px 8px rgba(108, 92, 231, 0.25);
  }
  .feedback-ai-btn:hover {
    background: #5b4bc4;
  }
  .feedback-complete-btn {
    background: #2ed573;
    color: white;
    box-shadow: 0 4px 8px rgba(46, 213, 115, 0.25);
  }
  .feedback-complete-btn:hover {
    background: #26af5f;
  }
  .modal-toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.8);
    color: white;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 0.9rem;
    z-index: 10001;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    white-space: pre-wrap;
    text-align: center;
  }
  .modal-toast.show {
    opacity: 1;
  }
</style>

<div id="feedbackModal" class="feedback-modal-overlay" style="display: none;">
  <div class="feedback-modal-card">
    <div class="feedback-modal-header">
      <span class="feedback-modal-title">🪄 알림장 및 피드백</span>
      <button class="feedback-modal-close" onclick="closeFeedbackModal()">×</button>
    </div>
    <div class="feedback-modal-body" style="display: flex; flex-direction: column; gap: 16px;">
      <div class="feedback-student-info">
        학생: <strong id="feedbackStudentName">홍길동</strong> (@<span id="feedbackStudentId">id</span>)
      </div>
      
      <!-- 오늘 완료한 문항 -->
      <div class="feedback-modal-section">
        <div class="feedback-section-title">🎯 오늘 학습 문항</div>
        <div id="feedbackTodayProblems" class="feedback-problems-text">
          불러오는 중...
        </div>
      </div>

      <!-- 옵션 설정 -->
      <div class="feedback-modal-section">
        <div class="feedback-section-title">⚙️ 옵션 설정</div>
        <div class="feedback-checkbox-row" style="flex-wrap: wrap; gap: 8px 16px;">
          <label class="feedback-checkbox">
            <input type="checkbox" id="modalIncludeGreeting" checked />
            인사말 포함
          </label>
          <label class="feedback-checkbox">
            <input type="checkbox" id="modalIncludeUsername" />
            풀이 계정 포함
          </label>
          <label class="feedback-checkbox">
            <input type="checkbox" id="modalIncludeReview" checked />
            오늘 학습 문항(복습 가이드) 포함
          </label>
        </div>
      </div>

      <!-- AI 코멘트 파이프라인 -->
      <div class="feedback-modal-section">
        <div class="feedback-section-title">🪄 AI 코멘트 작성</div>
        
        <div class="feedback-step-container">
          <div class="feedback-step-label">1단계: 관찰 메모 작성</div>
          <textarea id="modalTeacherMemo" placeholder="예: 오늘 피곤해 보여서 자주 깨움" class="feedback-input feedback-textarea" rows="1"></textarea>
        </div>

        <div class="feedback-step-container" style="margin-top: 8px;">
          <div class="feedback-step-label">2단계: 프롬프트 복사</div>
          <button id="modalCopyPromptBtn" class="feedback-btn feedback-ai-btn" onclick="copyModalAiPrompt()">
            📋 AI 프롬프트 복사
          </button>
        </div>

        <div class="feedback-step-container" style="margin-top: 8px;">
          <div class="feedback-step-label">3단계: AI 답변 붙여넣기</div>
          <textarea id="modalHomeworkComment" placeholder="외부 AI 답변 붙여넣기" class="feedback-input feedback-textarea" rows="1"></textarea>
        </div>

        <div class="feedback-step-container" style="margin-top: 8px;">
          <div class="feedback-step-label">4단계: 완료</div>
          <button id="modalCompleteBtn" class="feedback-btn feedback-complete-btn" onclick="submitModalFeedback()">
            📋 최종 복사 및 전송
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  let feedbackModalState = {
    name: "",
    studentId: "",
    userUuid: "",
    solvedTitles: []
  };

  function showModalToast(message, duration = 3000) {
    let toast = document.getElementById("modalToast");
    if (!toast) {
      toast = document.createElement("div");
      toast.id = "modalToast";
      toast.classList.add("modal-toast");
      document.body.appendChild(toast);
    }
    toast.textContent = message;
    toast.classList.add("show");
    setTimeout(() => {
      toast.classList.remove("show");
    }, duration);
  }

  async function modalCopyToClipboard(text) {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      let textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.style.position = "fixed";
      textArea.style.left = "-999999px";
      textArea.style.top = "-999999px";
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      try {
        document.execCommand("copy");
      } catch (err) {
        throw new Error("execCommand failed");
      } finally {
        textArea.remove();
      }
    }
  }

  // Textarea 자동 높이 조절
  function autoExpandModalTextarea(el) {
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  }

  document.querySelectorAll(".feedback-textarea").forEach((ta) => {
    ta.addEventListener("input", function () {
      autoExpandModalTextarea(this);
    });
    ta.addEventListener("change", function () {
      autoExpandModalTextarea(this);
    });
  });

  async function openFeedbackModal(name, studentId, userUuid) {
    feedbackModalState = { name, studentId, userUuid, solvedTitles: [] };
    
    document.getElementById("feedbackStudentName").textContent = name;
    document.getElementById("feedbackStudentId").textContent = studentId;
    document.getElementById("feedbackTodayProblems").textContent = "불러오는 중...";
    document.getElementById("modalTeacherMemo").value = "";
    document.getElementById("modalHomeworkComment").value = "";
    autoExpandModalTextarea(document.getElementById("modalTeacherMemo"));
    autoExpandModalTextarea(document.getElementById("modalHomeworkComment"));

    document.getElementById("feedbackModal").style.display = "flex";

    // 오늘 문제 불러오기
    try {
      const res = await fetch(`/api/streak?viewMode=user&viewUsername=${encodeURIComponent(studentId)}&days=1`);
      if (res.ok) {
        const data = await res.json();
        if (data.streak_data && data.streak_data.length > 0) {
          const todayDetails = data.streak_data[0].details || [];
          const titles = todayDetails.map(item => item.title);
          feedbackModalState.solvedTitles = titles;
          if (titles.length > 0) {
            document.getElementById("feedbackTodayProblems").textContent = "  * 오늘 완료 문항 (" + titles.length + "개): " + titles.join(", ");
          } else {
            document.getElementById("feedbackTodayProblems").textContent = "(오늘 완료한 문항 없음)";
          }
        } else {
          document.getElementById("feedbackTodayProblems").textContent = "(오늘 완료한 문항 없음)";
        }
      } else {
        document.getElementById("feedbackTodayProblems").textContent = "불러오기 실패";
      }
    } catch (e) {
      document.getElementById("feedbackTodayProblems").textContent = "오류 발생";
    }
  }

  function closeFeedbackModal() {
    document.getElementById("feedbackModal").style.display = "none";
  }

  // 모달 영역 바깥 클릭 시 닫기
  document.getElementById("feedbackModal").addEventListener("mousedown", (e) => {
    if (e.target.id === "feedbackModal") {
      closeFeedbackModal();
    }
  });

  async function copyModalAiPrompt() {
    const memoVal = document.getElementById("modalTeacherMemo").value.trim() || "";
    if (!memoVal) {
      showModalToast("⚠️ 먼저 관찰 메모를 작성해주세요!");
      return;
    }

    const includeReview = document.getElementById("modalIncludeReview").checked;
    let problemsSummary = "";
    if (includeReview && feedbackModalState.solvedTitles.length > 0) {
      problemsSummary = `  * 복습 문항 (${feedbackModalState.solvedTitles.length}개): ${feedbackModalState.solvedTitles.join(", ")}\n`;
    } else {
      problemsSummary = "  * (신규 숙제 및 복습용 지정 문항 없음)\n";
    }

    const finalMemo = memoVal;

    const promptText = `[역할]
너는 코딩학원 선생님의 알림장 피드백 코멘트를 작성해주는 전문 비서야.
아래 제공된 [숙제 내역], [교사 관찰 메모]를 바탕으로 학부모님께 알림장으로 보낼 정중하고 신뢰감 있는 코멘트(존댓말)를 작성해줘.

[작성 조건]
1. 과장되거나 상투적인 AI 어투(예: "한 단계 성장할 것입니다", "화이팅! 👍" 등)를 배제하고, 차분하고 담백한 전문 서술체(~했습니다, ~하고자 합니다)로 작성해줘.
2. 부드러운 격려나 친근한 감정 표현(예: ^^, ~, !)은 과하지 않게 아주 살짝만 허용해줘.
3. 코멘트는 총 2~3문장(약 200~300자) 내외의 적절한 길이로 구체적으로 작성해줘.
4. **학생의 학습 태도, 집중도, 진도율 및 학습 행동 분석**에 대해 교사 관찰 메모를 적극 반영하여 서술해줘.
5. **중요: 만약 숙제 정보에 '복습 문항'만 주어지고 오답/미완료 문항이 없다면**, 신규 숙제를 내주는 대신 **오늘 성공적으로 완료한 문제들을 집에서 복습(리뷰)하도록 안내했다는 맥락**으로 작성해줘.
6. **중요: 만약 숙제 정보가 '지정 문항 없음'으로 주어지면**, 신규 과제나 복습에 대한 언급을 완전히 제외하고, **오직 교사 관찰 메모의 내용을 상세하게 다듬어 오늘 수업 태도, 성향, 집중도 중심의 피드백 코멘트**로만 2~3문장을 채워줘.
7. **중요: 코멘트 작성 시 학생의 실제 이름을 직접 언급하지 마세요.** (예: 이름 대신 주어를 생략하거나 '학생은' 등으로 표현)
8. **중요: 다른 인사말이나 설명 없이 오직 복사해서 붙여넣을 '다듬어진 코멘트 텍스트'만 출력해줘.**

[정보]
- 숙제 정보:
${problemsSummary.trim()}
- 교사 관찰 메모: ${finalMemo}

[답변 예시 (참고용)]:
- 예시 A (신규 숙제가 있는 경우):
"오늘 학생은 딴짓 없이 차분하게 수업에 참여했으며, 정해진 시간 이후에도 문제를 더 풀고자 할 정도로 적극적인 학습 태도를 보였습니다. 금일 미완료된 '문자형 배열 및 인덱스 활용' 관련 4개 문항(15~18번)은 다음 시간까지 스스로 보완하며 학습 연속성을 이어갈 수 있도록 숙제로 안내했습니다."
- 예시 B (신규 숙제 없이 복습만 지시하는 경우):
"오늘 학생은 딴짓 없이 차분하게 수업에 참여했으며, 문제 본문에 제시된 조건을 정확히 파악하여 풀이를 완성했습니다. 별도의 신규 숙제는 없으며, 오늘 수업 중에 해결했던 '변수 출력' 문항들을 집에서 가볍게 복습하며 개념을 다질 수 있도록 안내했습니다."
- 예시 C (숙제/복습 지정 없이 수업 관찰 피드백만 하는 경우):
"오늘 학생은 딴짓 없이 차분하게 수업에 참여했으며, 모르는 부분이 나왔을 때 적극적으로 질문하며 해결하려는 자세를 보였습니다. 스스로 오답의 원인을 끝까지 찾아내어 논리적인 문제를 완전히 해결하려는 집중력이 돋보였습니다."`;

    try {
      await modalCopyToClipboard(promptText);
      showModalToast("📋 AI 프롬프트 복사 완료!\nChatGPT나 Claude에 붙여넣으세요.");
    } catch (err) {
      alert("프롬프트 복사 실패: " + err.message);
    }
  }

  async function submitModalFeedback() {
    const comment = document.getElementById("modalHomeworkComment").value.trim();
    if (!comment) {
      showModalToast("⚠️ AI 답변을 붙여넣어 주세요!");
      return;
    }

    const { name, studentId, userUuid } = feedbackModalState;
    const includeGreeting = document.getElementById("modalIncludeGreeting").checked;
    const includeUsername = document.getElementById("modalIncludeUsername").checked;
    const includeReview = document.getElementById("modalIncludeReview").checked;

    let finalMsg = "";
    if (includeGreeting) {
      finalMsg += "안녕하세요 두잉창의코딩학원입니다. 😊\n오늘 수업의 피드백을 안내해 드립니다.\n\n";
    }

    let displayName = "오늘";
    if (name && name !== studentId) {
      displayName = `${name} 학생`;
    }

    finalMsg += `📘 ${displayName} 수업 피드백\n`;

    if (includeUsername) {
      finalMsg += `👤 풀이 계정: ${studentId}\n`;
    }

    const todayStr = new Date().toLocaleDateString("ko-KR", {
      year: "numeric", month: "2-digit", day: "2-digit", weekday: "short"
    });
    finalMsg += `🗓 수업일: ${todayStr}\n`;
    if (includeReview && feedbackModalState.solvedTitles.length > 0) {
      finalMsg += `🎯 오늘 학습 문항(복습 대상): ${feedbackModalState.solvedTitles.join(", ")}\n`;
    }
    finalMsg += `📝 코멘트: ${comment}`;

    try {
      await modalCopyToClipboard(finalMsg);
      showModalToast("📋 최종 메시지 복사 완료!\n(카카오톡에 붙여넣기 하세요)");

      // DB 저장
      const btn = document.getElementById("modalCompleteBtn");
      const originalText = btn.textContent;
      btn.textContent = "⏳ 저장 중...";
      btn.disabled = true;

      const payload = {
        problems: [], // 피드백 전용이므로 문제 없음
        message: finalMsg,
        title: `${name} 학생 수업 피드백`,
        url: `${origin}/user/${studentId}`
      };

      const res = await fetch(`/api/students/${userUuid}/homework_logs`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      btn.disabled = false;
      btn.textContent = originalText;

      if (!res.ok) throw new Error("서버 응답 오류");
      
      if (window.attachHomeworkBadges) {
        setTimeout(() => {
          window.attachHomeworkBadges([userUuid]);
        }, 300);
      }
      
      setTimeout(() => {
        closeFeedbackModal();
      }, 1000);

    } catch (err) {
      showModalToast("복사에 실패했습니다.");
    }
  }
</script>

<!-- 피드백 작성 모달 공통 컴포넌트 -->
<!-- CSS: /static/css/components/feedback_modal.css -->
<!-- JS:  /static/js/modules/feedback_modal.js       -->

<div id="feedbackModal" class="feedback-modal-overlay" style="display: none;">
  <div class="feedback-modal-card">
    <div class="feedback-modal-header">
      <span class="feedback-modal-title">🪄 알림장 및 피드백</span>
      <button class="feedback-modal-close" onclick="closeFeedbackModal()">×</button>
    </div>

    <div class="feedback-student-info">
      학생: <strong id="feedbackStudentName">홍길동</strong> (@<span id="feedbackStudentId">id</span>)
    </div>

    <!-- 2컬럼 레이아웃 -->
    <div class="feedback-modal-grid">

      <!-- 좌측 컬럼: 숙제 문항 & 오늘 실습/제출 코드 현황 -->
      <div class="feedback-modal-column">
        <!-- 🎯 숙제 문항 -->
        <div class="feedback-modal-section">
          <div class="feedback-section-title">🎯 숙제 문항</div>
          <div id="feedbackHomeworkProblems" class="feedback-problems-text">
            장바구니 지정 숙제 없음
          </div>
        </div>

        <!-- 📊 오늘 실습 및 제출 코드 현황 -->
        <div class="feedback-modal-section">
          <div class="feedback-section-title">📊 오늘 풀이로그 &amp; 제출 코드 현황</div>
          <div id="feedbackTodayLogSummary" class="feedback-problems-text" style="max-height: 140px;">
            불러오는 중...
          </div>
        </div>

        <!-- 👀 완성될 카카오톡 알림장 실시간 미리보기 -->
        <div class="feedback-modal-section">
          <div class="feedback-section-title" style="display: flex; justify-content: space-between; align-items: center;">
            <span>👀 완성될 알림장 실시간 미리보기</span>
            <span style="font-size: 0.7rem; color: #8b5cf6; font-weight: 600;">실시간 갱신 중</span>
          </div>
          <div id="modalKakaoPreview" class="feedback-problems-text" style="max-height: 160px; min-height: 110px; background: #faf5ff; border-color: #d8b4fe; color: #3b0764; font-family: inherit; white-space: pre-wrap; font-size: 0.78rem; line-height: 1.45;">
            (미리보기 렌더링 중...)
          </div>
        </div>
      </div>

      <!-- 우측 컬럼: ⚙️ 옵션 설정 & AI 코멘트 작성 파이프라인 -->
      <div class="feedback-modal-column">
        <!-- ⚙️ 옵션 설정 -->
        <div class="feedback-modal-section">
          <div class="feedback-section-title">⚙️ 옵션 설정</div>
          <div class="feedback-radio-group">
            <label class="feedback-radio-label" id="labelNoticeHomework">
              <input type="radio" name="modalNoticeMode" id="modeNoticeHomework" value="homework" checked onclick="handleNoticeModeChange('homework')" />
              📘 숙제 안내
            </label>
            <label class="feedback-radio-label" id="labelNoticeReview">
              <input type="radio" name="modalNoticeMode" id="modeNoticeReview" value="review" onclick="handleNoticeModeChange('review')" />
              🔄 복습 안내
            </label>
            <label class="feedback-radio-label" id="labelNoticeComment">
              <input type="radio" name="modalNoticeMode" id="modeNoticeComment" value="comment" onclick="handleNoticeModeChange('comment')" />
              📝 코멘트만
            </label>
          </div>

          <div class="feedback-checkbox-row" style="margin-top: 6px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
            <label class="feedback-checkbox" title="알림장 상단에 인사말 포함">
              <input type="checkbox" id="modalIncludeGreeting" checked />
              인사말 포함
            </label>
            <label class="feedback-checkbox" id="wrapperShowSolveAccount" title="학생의 로그인 계정 ID 포함">
              <input type="checkbox" id="modalShowSolveAccount" />
              🔑 풀이계정 명시
            </label>
            <label class="feedback-checkbox" id="wrapperShowHomeworkList">
              <input type="checkbox" id="modalShowHomeworkList" checked />
              숙제 세부 목록 표시
            </label>
            <label class="feedback-checkbox" id="wrapperShowReviewList" style="display: none;">
              <input type="checkbox" id="modalShowReviewList" />
              복습 세부 목록 표시
            </label>
          </div>
        </div>

        <!-- AI 코멘트 파이프라인 -->
        <div class="feedback-modal-section">
          <div class="feedback-section-title">🪄 AI 코멘트 작성</div>

          <div class="feedback-step-container">
            <div class="feedback-step-label">1단계: 관찰 메모 작성</div>
            <textarea id="modalTeacherMemo" placeholder="예: 오늘 집중도 높았고 오답 혼자 해결함 (비워두면 기본값 적용)" class="feedback-input feedback-textarea" rows="1"></textarea>
            <div class="quick-tags-container" style="display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px;">
              <button type="button" class="quick-tag-btn" onclick="toggleQuickTag('modalTeacherMemo', '😊 집중도 최고')">😊 집중도 최고</button>
              <button type="button" class="quick-tag-btn" onclick="toggleQuickTag('modalTeacherMemo', '❓ 질문 적극적')">❓ 질문 적극적</button>
              <button type="button" class="quick-tag-btn" onclick="toggleQuickTag('modalTeacherMemo', '💡 오답 혼자 해결')">💡 오답 혼자 해결</button>
              <button type="button" class="quick-tag-btn" onclick="toggleQuickTag('modalTeacherMemo', '⚡ 풀이 속도 빠름')">⚡ 풀이 속도 빠름</button>
              <button type="button" class="quick-tag-btn" onclick="toggleQuickTag('modalTeacherMemo', '🧩 개념 재설명 완료')">🧩 개념 재설명 완료</button>
              <button type="button" class="quick-tag-btn" onclick="toggleQuickTag('modalTeacherMemo', '⚠️ 문법/오타 실수 주의')">⚠️ 문법/오타 실수 주의</button>
              <button type="button" class="quick-tag-btn" onclick="toggleQuickTag('modalTeacherMemo', '📘 지난 수업 복습 완료')">📘 지난 수업 복습 완료</button>
              <button type="button" class="quick-tag-btn" onclick="toggleQuickTag('modalTeacherMemo', '🚀 심화 문제까지 도전')">🚀 심화 문제까지 도전</button>
              <button type="button" class="quick-tag-btn" onclick="toggleQuickTag('modalTeacherMemo', '💤 조금 피곤해함')">💤 조금 피곤해함</button>
            </div>
          </div>

          <div class="feedback-step-container" style="margin-top: 6px;">
            <div class="feedback-step-label">2단계: AI 피드백 자동 생성</div>
            <!-- 🪄 메인: Gemini API 원클릭 생성 -->
            <button id="modalGenerateAiBtn" class="feedback-btn feedback-complete-btn"
                    style="background: linear-gradient(135deg, #7c3aed, #5b21b6); margin-bottom: 6px;"
                    onclick="generateModalAiFeedback()">
              🪄 AI 피드백 생성 (1초 완성)
            </button>
            <!-- 서브: 기존 프롬프트 복사 (Fallback) -->
            <button id="modalCopyPromptBtn" class="feedback-btn feedback-ai-btn"
                    style="font-size: 0.78rem; padding: 5px 10px; opacity: 0.75;"
                    onclick="copyModalAiPrompt()">
              📋 직접 복사 후 외부 AI 사용 (Fallback)
            </button>
          </div>

          <div class="feedback-step-container" style="margin-top: 6px;">
            <div class="feedback-step-label">3단계: AI 생성 결과 확인 &amp; 수정</div>
            <textarea id="modalHomeworkComment"
                      placeholder="▶ [AI 피드백 생성] 버튼을 누르면 여기에 완성된 알림장이 자동으로 채워집니다.&#10;직접 외부 AI 답변을 붙여넣기 하셔도 됩니다."
                      class="feedback-input feedback-textarea" rows="3"></textarea>
          </div>

          <div class="feedback-step-container" style="margin-top: 6px;">
            <div class="feedback-step-label">4단계: 완료 및 출제</div>
            <button id="modalCompleteBtn" class="feedback-btn feedback-complete-btn" onclick="submitModalFeedback()">
              📋 카카오톡 알림장 복사 &amp; 숙제/피드백 저장
            </button>
          </div>
        </div>
      </div>


    </div>
  </div>
</div>

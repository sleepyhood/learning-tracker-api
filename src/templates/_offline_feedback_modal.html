<!-- 오프라인/교재 전용 1클릭 피드백 작성 모달 (슬림 2컬럼 레이아웃) -->
<!-- HTML: /templates/_offline_feedback_modal.html -->
<!-- JS:   /static/js/modules/offline_feedback_modal.js -->

<div id="offlineFeedbackModal" class="feedback-modal-overlay" style="display: none;">
  <div class="feedback-modal-card" style="max-width: 860px; width: 92%;">
    <div class="feedback-modal-header" style="background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; padding: 14px 20px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 1.2rem;">🪄</span>
        <span class="feedback-modal-title" style="color: white; font-weight: 700;">오프라인/교재 1클릭 알림장 (Scratch &amp; COS PRO &amp; 기타)</span>
      </div>
      <button class="feedback-modal-close" style="color: white;" onclick="closeOfflineFeedbackModal()">×</button>
    </div>

    <!-- 학생 이름 단일 입력 헤더 -->
    <div style="background: #f8fafc; padding: 12px 20px; border-bottom: 1px solid #e2e8f0; display: flex; gap: 12px; align-items: center;">
      <label style="font-size: 0.88rem; font-weight: 700; color: #334155; white-space: nowrap;">✏️ 학생 이름:</label>
      <input type="text" id="offlineStudentCustomName" class="feedback-input" placeholder="학생 이름을 입력하세요 (예: 김철수)" style="flex: 1; padding: 6px 12px; font-size: 0.88rem; font-weight: 600;" />
    </div>

    <!-- 2컬럼 슬림 레이아웃 (Left: 과목/성취도/메모 | Right: 미리보기 & AI 파이프라인 & 히스토리) -->
    <div class="feedback-modal-grid" style="padding: 16px 20px; gap: 20px; grid-template-columns: 1fr 1fr;">

      <!-- Left Column: 과목/개념/성취도/메모 선택 -->
      <div class="feedback-modal-column" style="display: flex; flex-direction: column; gap: 12px;">
        <!-- 1. 과목/커리큘럼 선택 -->
        <div class="feedback-modal-section">
          <div class="feedback-section-title">📘 1. 과목 및 커리큘럼 선택</div>
          <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-top: 6px;">
            <label class="feedback-radio-label" style="font-size: 0.78rem; padding: 6px 8px;">
              <input type="radio" name="offlineSubject" value="cos_scratch_2" checked onclick="handleOfflineSubjectChange('cos_scratch_2')" />
              🧩 COS Scratch 2급
            </label>
            <label class="feedback-radio-label" style="font-size: 0.78rem; padding: 6px 8px;">
              <input type="radio" name="offlineSubject" value="cos_scratch_3" onclick="handleOfflineSubjectChange('cos_scratch_3')" />
              🧩 COS Scratch 3급
            </label>
            <label class="feedback-radio-label" style="font-size: 0.78rem; padding: 6px 8px;">
              <input type="radio" name="offlineSubject" value="scratch" onclick="handleOfflineSubjectChange('scratch')" />
              🐱 Scratch 블록
            </label>
            <label class="feedback-radio-label" style="font-size: 0.78rem; padding: 6px 8px;">
              <input type="radio" name="offlineSubject" value="cos_pro_2" onclick="handleOfflineSubjectChange('cos_pro_2')" />
              🏆 COS PRO 2급
            </label>
            <label class="feedback-radio-label" style="font-size: 0.78rem; padding: 6px 8px;">
              <input type="radio" name="offlineSubject" value="cos_pro_1" onclick="handleOfflineSubjectChange('cos_pro_1')" />
              🥇 COS PRO 1급
            </label>
            <label class="feedback-radio-label" style="font-size: 0.78rem; padding: 6px 8px;">
              <input type="radio" name="offlineSubject" value="other" onclick="handleOfflineSubjectChange('other')" />
              📚 기타 교재
            </label>
          </div>
        </div>

        <!-- 2. 세부 학습 개념 및 유형 -->
        <div class="feedback-modal-section">
          <div class="feedback-section-title">📖 2. 오늘 학습 개념 / 실기 유형</div>
          <select id="offlineConceptSelect" class="feedback-input" style="width: 100%; padding: 6px 10px; font-size: 0.85rem; margin-top: 6px;">
            <!-- JS 동적 렌더링 -->
          </select>
          <div id="offlineConceptDesc" style="font-size: 0.73rem; color: #2563eb; background: #eff6ff; padding: 6px 10px; border-radius: 6px; margin-top: 6px; border: 1px solid #bfdbfe; line-height: 1.35;">
            개념 설명 로딩 중...
          </div>
        </div>

        <!-- 3. 오늘 성취도 & 관찰 메모 -->
        <div class="feedback-modal-section">
          <div class="feedback-section-title">📊 3. 오늘 수업 성취도 &amp; 관찰 메모</div>
          <div style="display: flex; gap: 6px; margin-top: 6px;">
            <label class="feedback-radio-label" style="flex: 1; text-align: center; padding: 5px; font-size: 0.78rem;">
              <input type="radio" name="offlineStatus" value="GOOD" checked onclick="updateOfflineLivePreview()" /> 🟢 우수 (높음)
            </label>
            <label class="feedback-radio-label" style="flex: 1; text-align: center; padding: 5px; font-size: 0.78rem;">
              <input type="radio" name="offlineStatus" value="WARNING" onclick="updateOfflineLivePreview()" /> 🟡 보통 (보완)
            </label>
            <label class="feedback-radio-label" style="flex: 1; text-align: center; padding: 5px; font-size: 0.78rem;">
              <input type="radio" name="offlineStatus" value="DANGER" onclick="updateOfflineLivePreview()" /> 🔴 지도필요
            </label>
          </div>

          <div style="margin-top: 8px;">
            <textarea id="offlineTeacherMemo" placeholder="관찰 메모 (예: 집중도 우수, 변수 조건문 혼자 해결)" class="feedback-input feedback-textarea" rows="2" style="font-size: 0.82rem;"></textarea>
            <div id="offlineQuickTags" class="quick-tags-container" style="display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px;">
              <!-- JS 동적 태그 -->
            </div>
          </div>
        </div>
      </div>

      <!-- Right Column: 카톡 미리보기 & 4단계 AI 파이프라인 & 히스토리 -->
      <div class="feedback-modal-column" style="display: flex; flex-direction: column; gap: 12px;">
        <!-- 실시간 카톡 미리보기 (상투적 맺음말 제거 완료) -->
        <div class="feedback-modal-section">
          <div class="feedback-section-title" style="display: flex; justify-content: space-between; align-items: center;">
            <span>📱 완성될 알림장 실시간 미리보기</span>
            <span style="font-size: 0.7rem; color: #2563eb; font-weight: 600;">실시간 갱신</span>
          </div>
          <div id="offlineKakaoPreview" class="feedback-problems-text" style="max-height: 150px; min-height: 110px; background: #faf5ff; border-color: #d8b4fe; color: #3b0764; font-size: 0.78rem; line-height: 1.45; white-space: pre-wrap; margin-top: 6px;">
            (미리보기 생성 중...)
          </div>
        </div>

        <!-- 📋 4단계 AI 파이프라인 -->
        <div class="feedback-modal-section">
          <div class="feedback-section-title">🪄 AI 코멘트 작성 파이프라인</div>

          <div style="margin-top: 6px;">
            <div style="font-size: 0.75rem; font-weight: 700; color: #475569; margin-bottom: 3px;">1단계: AI 피드백 자동 생성</div>
            <!-- 🪄 메인: Gemini API 원클릭 생성 -->
            <button id="offlineGenerateAiBtn" class="feedback-btn feedback-complete-btn"
                    style="background: linear-gradient(135deg, #7c3aed, #5b21b6); width: 100%; padding: 7px 10px; font-size: 0.85rem; font-weight: 700; margin-bottom: 6px;"
                    onclick="generateOfflineAiFeedback()">
              🪄 AI 피드백 생성 (1초 완성)
            </button>
            <!-- 서브: 기존 프롬프트 복사 (Fallback) -->
            <button id="offlineCopyPromptBtn" class="feedback-btn feedback-ai-btn"
                    style="padding: 5px 10px; font-size: 0.75rem; width: 100%; opacity: 0.75;"
                    onclick="copyOfflineAiPrompt()">
              📋 직접 복사 후 외부 AI 사용 (Fallback)
            </button>
          </div>

          <div style="margin-top: 8px;">
            <div style="font-size: 0.75rem; font-weight: 700; color: #475569; margin-bottom: 3px;">2단계: AI 생성 결과 확인 &amp; 수정</div>
            <textarea id="offlineAiResponseComment"
                      placeholder="▶ [AI 피드백 생성] 버튼을 누르면 여기에 완성된 알림장이 자동으로 채워집니다.&#10;직접 외부 AI 답변을 붙여넣기 하셔도 됩니다."
                      class="feedback-input feedback-textarea" rows="3" style="font-size: 0.82rem;"></textarea>
          </div>

          <div style="display: flex; gap: 8px; margin-top: 10px;">
            <button class="feedback-btn feedback-complete-btn" style="flex: 2; padding: 8px; font-size: 0.85rem; font-weight: 700; background: linear-gradient(135deg, #2563eb, #1d4ed8);" onclick="copyOfflineFeedbackToClipboard()">
              📋 카카오톡 알림장 1초 복사
            </button>
            <button class="feedback-btn" style="flex: 1; padding: 8px; font-size: 0.8rem; background: #475569; color: white;" onclick="saveOfflineFeedbackToHistory()">
              💾 기록 저장
            </button>
          </div>
        </div>


        <!-- 📜 최근 피드백 히스토리 -->
        <div class="feedback-modal-section">
          <div class="feedback-section-title" style="display: flex; justify-content: space-between; align-items: center;">
            <span>📜 최근 오프라인 피드백 히스토리</span>
            <button class="btn-small btn-ghost" style="font-size: 0.7rem; color: #64748b;" onclick="clearOfflineFeedbackHistory()">비우기</button>
          </div>
          <div id="offlineHistoryContainer" style="max-height: 110px; overflow-y: auto; margin-top: 6px; font-size: 0.75rem;">
            <div style="color: #94a3b8; padding: 8px; text-align: center;">저장된 히스토리가 없습니다.</div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

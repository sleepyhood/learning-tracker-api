<header class="page-header">
  <div class="header-left">
    <a href="/" class="brand-link">
      <h1 class="page-title">진도율 시각화</h1>
    </a>
    <p class="page-subtitle">
      학생 진도와 숙제 현황을 하나의 대시보드에서 관리합니다.
    </p>
  </div>

  <div class="header-search">
    <form id="search-form" method="POST" action="/" autocomplete="off">
      <div class="search-wrapper">
        <input
          type="text"
          id="username-input"
          name="username"
          placeholder="학생 이름 또는 display_id 검색"
          aria-label="학생 검색"
          autocomplete="off"
        />
        <button
          type="button"
          id="search-clear-btn"
          class="search-clear hidden"
          aria-label="검색어 지우기"
        >
          ×
        </button>
        <button type="submit" id="search-btn" aria-label="검색 실행">
          <img
            src="/static/search-icon.png"
            alt="검색"
            width="20"
            height="20"
          />
        </button>
      </div>
      <ul id="autocomplete-list" class="autocomplete-box"></ul>
    </form>
  </div>

  <div class="header-tools">
    <a href="/schedule" class="btn-secondary header-tool">수업 스케줄</a>
    <button
      type="button"
      class="btn-primary header-tool"
      title="진도 새로고침"
      onclick="refreshUserProgress('{{ username }}')"
    >
      새로고침
    </button>
    <button
      type="button"
      class="btn-quiet header-tool"
      title="목록으로 이동"
      onclick="goToParentPage()"
    >
      목록으로
    </button>
  </div>
</header>

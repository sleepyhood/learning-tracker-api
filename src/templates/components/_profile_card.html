<aside id="profile-container" class="chart-card">
  <div class="profile-head">
    <img
      src="{{ avatar_path }}"
      alt="사용자 아바타"
      width="100"
      height="100"
      class="profile-avatar"
    />
    <div class="profile-identity">
      <h2 class="profile-name">{{ username }}</h2>
      <div class="profile-badges">
        <span class="chip chip-role {{ 'admin' if is_admin else 'user' }}"
          >{{ role_label }}</span
        >
        {% if primary_lang %}
        <span
          class="chip chip-lang"
          title="상위 언어: {% for l,c in primary_lang_top3 %}{{ l }} {{ c }}{% if not loop.last %}, {% endif %}{% endfor %}"
        >주사용 언어: {{ primary_lang }}</span>
        {% endif %}
      </div>
    </div>
  </div>

  <div class="profile-meta-row" style="margin-top: 14px;">
    <div class="profile-actions" style="display: flex; gap: 8px; flex-wrap: wrap; width: 100%;">
      {% if is_admin or viewer_is_admin %}
      <button
        type="button"
        class="btn btn-primary"
        onclick="openFeedbackModal('{{ username }}', '{{ username }}', '{{ user_uuid }}')"
        style="flex: 1; min-width: 140px; padding: 10px 12px; border-radius: 12px; font-weight: 700; font-size: 0.82rem; cursor: pointer; background: linear-gradient(135deg, #6c5ce7, #5b4bc4); color: white; border: none; display: inline-flex; align-items: center; justify-content: center; gap: 4px; box-shadow: 0 4px 14px rgba(108, 92, 231, 0.3);"
      >✨ OJ 피드백 작성</button>
      <button
        type="button"
        class="btn btn-primary"
        onclick="openOfflineFeedbackModal('{{ username }}', '{{ username }}')"
        style="flex: 1; min-width: 140px; padding: 10px 12px; border-radius: 12px; font-weight: 700; font-size: 0.82rem; cursor: pointer; background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; border: none; display: inline-flex; align-items: center; justify-content: center; gap: 4px; box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);"
      >✨ 오프라인 피드백</button>
      {% endif %}
    </div>
    <p class="profile-last-login" style="margin-top: 8px; font-size: 0.78rem; color: #94a3b8;">최근 접속: {{ last_login }}</p>
  </div>

  <div id="profile-stats">
    <div>
      <div class="stat-value">{{ accepted_number }}</div>
      <div class="stat-label">정답 문제</div>
    </div>
    <div>
      <div class="stat-value">{{ submission_number }}</div>
      <div class="stat-label">제출 수</div>
    </div>
    <div>
      <div class="stat-value">{{ total_score }}</div>
      <div class="stat-label">누적 점수</div>
    </div>
  </div>

  <div id="today-latest-problem" class="today-problem-box">
    <div class="today-problem-title-row">
      <span id="today-problem-label" class="today-problem-label">오늘 마지막 풀이</span>
      <span id="today-problem-status-badge" class="today-problem-badge">미제출</span>
    </div>
    <div class="today-problem-content">
      <div class="today-problem-title-wrapper">
        <a id="today-problem-link" href="#" target="_blank" rel="noopener" class="today-problem-title" style="pointer-events: none;">오늘 제출 내역 없음</a>
        <button type="button" id="today-problem-copy-btn" class="btn-quiet streak-inline-btn today-copy-btn" style="display: none;" title="제목 복사">제목 복사</button>
        <button type="button" id="today-problem-jump-btn" class="btn-quiet streak-inline-btn today-jump-btn" style="display: none; color: #2563eb; background: #eff6ff; border: 1px solid #bfdbfe; font-weight: 600; margin-left: 4px;" title="단원 위치로 이동">🎯 위치 찾기</button>
      </div>
      <span id="today-problem-meta" class="today-problem-meta">-</span>
    </div>
  </div>
</aside>

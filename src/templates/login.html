<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>로그인 | 학습 진도 대시보드</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0f1218;
        --ink: #f5f7fb;
        --muted: #b8c0cc;
        --accent: #56d6ff;
        --accent-2: #a6ff7a;
        --glass: rgba(255, 255, 255, 0.08);
        --stroke: rgba(255, 255, 255, 0.18);
        --shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(1200px 600px at 10% 10%, #20263a 0%, transparent 60%),
          radial-gradient(900px 600px at 90% 20%, #1a3b4f 0%, transparent 55%),
          linear-gradient(160deg, #0b0d12 0%, #0f1218 55%, #121722 100%);
        color: var(--ink);
        font-family: "Noto Sans KR", "Segoe UI", sans-serif;
      }

      .shell {
        width: min(980px, 94vw);
        display: grid;
        gap: 24px;
        grid-template-columns: 1.1fr 0.9fr;
        padding: 32px;
      }

      .hero {
        padding: 28px 18px;
      }

      .hero .tag {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        font-size: 12px;
        color: var(--muted);
        padding: 6px 10px;
        border: 1px solid var(--stroke);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.03);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .hero h1 {
        font-family: "Noto Sans KR", sans-serif;
        font-weight: 800;
        font-size: clamp(34px, 4.3vw, 50px);
        margin: 16px 0 12px;
        line-height: 1.2;
        letter-spacing: -0.02em;
      }

      .hero p {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.6;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-top: 24px;
      }

      .stat {
        padding: 14px 16px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--stroke);
      }

      .stat h3 {
        margin: 0;
        font-size: 20px;
      }

      .stat span {
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.02em;
      }

      .card {
        background: var(--glass);
        border: 1px solid var(--stroke);
        border-radius: 22px;
        padding: 28px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }

      .card h2 {
        margin: 0 0 8px;
        font-size: 24px;
      }

      .card p {
        color: var(--muted);
        margin: 0 0 20px;
        font-size: 14px;
      }

      .error {
        background: rgba(255, 86, 86, 0.12);
        border: 1px solid rgba(255, 86, 86, 0.3);
        color: #ffb2b2;
        padding: 10px 12px;
        border-radius: 10px;
        margin-bottom: 12px;
        font-size: 13px;
      }

      .field {
        display: grid;
        gap: 6px;
        margin-bottom: 14px;
      }

      .field label {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }

      .field input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(12, 14, 20, 0.65);
        color: var(--ink);
        font-size: 15px;
        outline: none;
        transition:
          border-color 0.2s ease,
          box-shadow 0.2s ease;
      }

      .field input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(86, 214, 255, 0.2);
      }

      .submit {
        width: 100%;
        padding: 12px 16px;
        border-radius: 12px;
        border: none;
        background: linear-gradient(120deg, var(--accent), var(--accent-2));
        color: #0b0d12;
        font-weight: 700;
        font-size: 15px;
        cursor: pointer;
        transition:
          transform 0.15s ease,
          box-shadow 0.2s ease;
      }

      .submit:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 30px rgba(86, 214, 255, 0.25);
      }

      .hint {
        margin-top: 14px;
        font-size: 12px;
        color: var(--muted);
      }

      @media (max-width: 860px) {
        .shell {
          grid-template-columns: 1fr;
          padding: 18px;
        }

        .hero {
          order: 2;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <span class="tag">학습 운영 대시보드 · 2025</span>
        <h1>오늘의 학습 현황을 <br />빠르게 확인하세요</h1>
        <p>
          관리자와 학생이 함께 사용하는 통합 화면입니다. 문제 진도, 숙제 현황,
          주간 학습 흐름을 한 곳에서 확인할 수 있습니다.
        </p>
        <div class="stats">
          <div class="stat">
            <h3>실시간</h3>
            <span>진도 및 숙제 현황</span>
          </div>
          <div class="stat">
            <h3>연동</h3>
            <span>반 · 학생 · 문제 데이터</span>
          </div>
        </div>
      </section>

      <section class="card">
        <h2>로그인</h2>
        <p>대시보드를 열기 위해 계정 정보를 입력하세요.</p>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="post">
          <div class="field">
            <label for="username">아이디</label>
            <input id="username" type="text" name="username" required />
          </div>
          <div class="field">
            <label for="password">비밀번호</label>
            <input id="password" type="password" name="password" required />
          </div>
          <button class="submit" type="submit">로그인</button>
        </form>
        <p class="hint">공용 기기에서는 사용 후 반드시 로그아웃하세요.</p>
      </section>
    </main>
  </body>
</html>

<!DOCTYPE html>
<html lang="ko">
  <head>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>로그인 | 학습 진도 대시보드</title>
    <style>
      :root {
        --bg: #f7f9fc;
        --surface: #ffffff;
        --ink: #0f172a;
        --muted: #64748b;
        --accent: #2563eb;
        --accent-2: #22c55e;
        --line: #e2e8f0;
        --shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(1200px 600px at 10% 10%, #e0edff 0%, transparent 60%),
          radial-gradient(900px 600px at 90% 20%, #e6fff1 0%, transparent 55%),
          linear-gradient(160deg, #f7f9fc 0%, #f2f6fb 55%, #edf2f8 100%);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      }

      .shell {
        width: min(980px, 94vw);
        display: grid;
        gap: 24px;
        grid-template-columns: 1.1fr 0.9fr;
        padding: 32px;
      }

      .hero {
        padding: 28px 18px;
      }

      .hero .tag {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        font-size: 12px;
        color: var(--muted);
        padding: 6px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(37, 99, 235, 0.08);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .hero h1 {
        font-weight: 700;
        font-size: clamp(36px, 5vw, 56px);
        margin: 16px 0 12px;
        line-height: 1.05;
      }

      .hero p {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.6;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-top: 24px;
      }

      .stat {
        padding: 14px 16px;
        border-radius: 14px;
        background: #ffffff;
        border: 1px solid var(--line);
        box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
      }

      .stat h3 {
        margin: 0;
        font-size: 20px;
      }

      .stat span {
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.02em;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: 28px;
        box-shadow: var(--shadow);
      }

      .card h2 {
        margin: 0 0 8px;
        font-size: 24px;
      }

      .card p {
        color: var(--muted);
        margin: 0 0 20px;
        font-size: 14px;
      }

      .error {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.35);
        color: #b91c1c;
        padding: 10px 12px;
        border-radius: 10px;
        margin-bottom: 12px;
        font-size: 13px;
      }

      .field {
        display: grid;
        gap: 6px;
        margin-bottom: 14px;
      }

      .field label {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }

      .field input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: #ffffff;
        color: var(--ink);
        font-size: 15px;
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .field input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
      }

      .submit {
        width: 100%;
        padding: 12px 16px;
        border-radius: 12px;
        border: none;
        background: linear-gradient(120deg, var(--accent), var(--accent-2));
        color: #ffffff;
        font-weight: 700;
        font-size: 15px;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.2s ease;
      }

      .submit:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 30px rgba(37, 99, 235, 0.2);
      }

      .hint {
        margin-top: 14px;
        font-size: 12px;
        color: var(--muted);
      }

      @media (max-width: 860px) {
        .shell {
          grid-template-columns: 1fr;
          padding: 18px;
        }

        .hero {
          order: 2;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <span class="tag">학습 운영 2025</span>
        <h1>매일의 학습 진도를 한눈에 확인하세요</h1>
        <p>
          관리자와 학생이 함께 쓰는 통합 대시보드입니다. 문제 진도, 숙제 현황,
          주간 일정을 한 곳에서 확인할 수 있습니다.
        </p>
        <div class="stats">
          <div class="stat">
            <h3>실시간</h3>
            <span>진도 및 숙제</span>
          </div>
          <div class="stat">
            <h3>연동</h3>
            <span>반, 학생, 문제 데이터</span>
          </div>
        </div>
      </section>

      <section class="card">
        <h2>로그인</h2>
        <p>대시보드를 열기 위해 계정 정보를 입력하세요.</p>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="post">
          <div class="field">
            <label for="username">아이디</label>
            <input id="username" type="text" name="username" required />
          </div>
          <div class="field">
            <label for="password">비밀번호</label>
            <input id="password" type="password" name="password" required />
          </div>
          <button class="submit" type="submit">로그인</button>
        </form>
        <p class="hint">공용 기기에서는 사용 후 반드시 로그아웃하세요.</p>
      </section>
    </main>
  </body>
</html>

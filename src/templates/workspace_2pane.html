<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace 2-Pane</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/workspace_apple.css">
</head>
<body>
    <header class="workspace-header">
        <div class="header-content">
            <h1 class="header-title">🍎 Dual Workspace</h1>
            <div class="header-actions">
                <button class="btn-primary" id="btn-export-excel">⬇ 엑셀 내보내기</button>
                <button class="btn-secondary" onclick="window.location.href='/schedule'">기존 스케줄로 돌아가기</button>
            </div>
        </div>
    </header>

    <div class="workspace-container">
        <!-- Left Pane: Problem Picker -->
        <aside class="pane-left">
            <div class="pane-header">
                <h2>🎯 문제 카탈로그</h2>
                <input type="text" id="problem-search" class="search-input" placeholder="문제 제목 또는 번호 검색...">
            </div>
            
            <div class="problem-list" id="problem-list-container">
                <div class="problem-empty-state">학생을 먼저 선택하거나 챕터를 로드하세요.</div>
            </div>

            <div class="pickup-basket">
                <div class="basket-header">
                    <h3>🛒 숙제 바구니 (<span id="basket-count">0</span>)</h3>
                    <button class="btn-small btn-ghost" id="btn-clear-basket">비우기</button>
                </div>
                <ul id="basket-items" class="basket-items-list">
                    <!-- 담긴 문제가 표시될 곳 -->
                </ul>
            </div>
        </aside>

        <!-- Right Pane: Student Feedback Grid -->
        <main class="pane-right">
            <div class="pane-header" style="flex-direction: column; align-items: stretch; gap: 12px;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h2>👥 요일별 수강생 보드</h2>
                    <div class="filter-actions">
                        <button class="btn-small btn-primary" id="btn-add-student-modal">+ 수강생 수동 등록</button>
                    </div>
                </div>
                <!-- 요일 필터 탭 -->
                <div class="weekday-tabs" id="weekday-tabs">
                    <button class="tab-btn active" data-weekday="all">전체</button>
                    <button class="tab-btn" data-weekday="0">월</button>
                    <button class="tab-btn" data-weekday="1">화</button>
                    <button class="tab-btn" data-weekday="2">수</button>
                    <button class="tab-btn" data-weekday="3">목</button>
                    <button class="tab-btn" data-weekday="4">금</button>
                    <button class="tab-btn" data-weekday="5">토</button>
                    <button class="tab-btn" data-weekday="6">일</button>
                </div>
            </div>

            <div class="student-grid" id="student-grid-container">
                <!-- 학생 카드들이 렌더링될 곳 -->
            </div>
        </main>
    </div>

    <!-- 신규 학생 등록 모달 -->
    <div id="register-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>📝 수강생 수동 등록</h3>
            <div class="modal-body">
                <label>이름</label>
                <input type="text" id="reg-name" placeholder="예: 홍길동">
                
                <label>생년월일 4자리 (선택)</label>
                <input type="text" id="reg-birth" placeholder="예: 0505" maxlength="4">

                <label>요일 슬롯 (필수)</label>
                <select id="reg-slot">
                    <option value="">불러오는 중...</option>
                </select>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="btn-close-modal">취소</button>
                <button class="btn-primary" id="btn-submit-register">등록하기</button>
            </div>
        </div>
    </div>

    <!-- 통합 AI 피드백 & 과제 컨트롤 모달 -->
    <div id="unified-feedback-modal" class="modal-overlay">
        <div class="modal-content" style="width: 580px; max-width: 95%; max-height: 90vh; overflow-y: auto;">
            <h3 style="display: flex; justify-content: space-between; align-items: center;">
                <span>🪄 <span id="ufm-student-name">학생</span> 피드백 & 숙제 컨트롤러</span>
                <button class="btn-small btn-ghost" id="btn-close-ufm">✕</button>
            </h3>
            
            <div class="modal-body" style="gap: 16px;">
                <!-- 수업 구분 / 개념 프리셋 선택 -->
                <div>
                    <label style="font-weight: 700;">1. 오늘 수업 유형 선택</label>
                    <select id="ufm-preset-select" style="width: 100%; margin-top: 4px;">
                        <!-- JS에서 OFFLINE_PRESETS를 통해 동적 생성 -->
                    </select>
                </div>

                <!-- 개념 요약 미리보기 / 자동 감지 -->
                <div id="ufm-concept-box" style="background: rgba(0,113,227,0.06); border: 1px solid rgba(0,113,227,0.2); padding: 10px 12px; border-radius: 8px; font-size: 0.85rem; color: var(--accent-color);">
                    💡 <strong>학습 개념:</strong> <span id="ufm-concept-text">불러오는 중...</span>
                </div>

                <!-- 오늘 완료한 문제 & 바구니 숙제 요약 -->
                <div>
                    <label style="font-weight: 700;">2. 문항 현황</label>
                    <div id="ufm-problem-summary" style="font-size: 0.85rem; color: var(--text-secondary); background: #f8f9fa; padding: 8px 12px; border-radius: 8px; margin-top: 4px;">
                        불러오는 중...
                    </div>
                </div>

                <!-- 관찰 메모 & 퀵 태그 -->
                <div>
                    <label style="font-weight: 700;">3. 관찰 메모 & 퀵 태그</label>
                    <textarea id="ufm-teacher-memo" class="student-memo" rows="2" placeholder="비워두면 기본값 적용 (예: 오늘 수업에 차분하고 성실하게 임함)" style="margin-top: 4px;"></textarea>
                    <div style="display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px;">
                        <button type="button" class="btn-small btn-secondary" onclick="toggleQuickTag('ufm-teacher-memo', '😊 집중도 좋음')">😊 집중도 좋음</button>
                        <button type="button" class="btn-small btn-secondary" onclick="toggleQuickTag('ufm-teacher-memo', '❓ 질문 적극적')">❓ 질문 적극적</button>
                        <button type="button" class="btn-small btn-secondary" onclick="toggleQuickTag('ufm-teacher-memo', '💡 오답 혼자 해결')">💡 오답 혼자 해결</button>
                        <button type="button" class="btn-small btn-secondary" onclick="toggleQuickTag('ufm-teacher-memo', '⚡ 풀이 속도 빠름')">⚡ 풀이 속도 빠름</button>
                        <button type="button" class="btn-small btn-secondary" onclick="toggleQuickTag('ufm-teacher-memo', '💤 조금 피곤해함')">💤 조금 피곤해함</button>
                    </div>
                </div>

                <!-- 프롬프트 생성 & 복사 -->
                <div style="display: flex; justify-content: space-between; align-items: center; background: #f1f5f9; padding: 8px 12px; border-radius: 8px;">
                    <span style="font-size: 0.85rem; font-weight: 600;">📋 AI 프롬프트 생성</span>
                    <button class="btn-small btn-primary" id="btn-copy-ufm-prompt">📋 AI 프롬프트 복사</button>
                </div>

                <!-- 외부 AI 답변 붙여넣기 -->
                <div>
                    <label style="font-weight: 700;">4. 외부 AI 답변 붙여넣기</label>
                    <textarea id="ufm-ai-comment" class="student-memo" rows="3" placeholder="ChatGPT/Claude에서 생성된 다듬어진 코멘트를 붙여넣으세요" style="margin-top: 4px;"></textarea>
                </div>

                <!-- 최종 3종 액션 복사 및 저장 -->
                <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 8px; padding-top: 12px; border-top: 1px dashed var(--panel-border);">
                    <div style="display: flex; gap: 8px;">
                        <button class="btn-small btn-secondary" id="btn-copy-parent-msg" style="flex: 1;">📱 학부모 카톡 복사 (b)</button>
                        <button class="btn-small btn-secondary" id="btn-copy-student-msg" style="flex: 1;">🎒 학생용 숙제 복사 (c)</button>
                    </div>
                    <div style="display: flex; gap: 8px;">
                        <button class="btn-small btn-secondary" id="btn-copy-excel-line" style="flex: 1; background: #e0f2fe; color: #0369a1; border-color: #bae6fd;">📊 엑셀 1줄 복사 (Tab 구분)</button>
                        <button class="btn-primary" id="btn-save-ufm-final" style="flex: 1;">💾 최종 완료 및 저장</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="/static/js/ai_prompt.js"></script>
    <script src="/static/js/workspace_2pane.js"></script>
</body>
</html>
